name: Deploy Krypton Ecosystem

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Krypton Ecosystem
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Install Cloudflare Vinext toolchain
        run: |
          npm install \
            vite@8 \
            @vitejs/plugin-rsc \
            @cloudflare/vite-plugin \
            vinext@latest \
            @vinext/cloudflare@latest \
            --save-dev \
            --legacy-peer-deps

      - name: Initialize Vinext for Cloudflare
        run: npx vinext init --platform=cloudflare --skip-check

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Deploy Krypton Ecosystem
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx @vinext/cloudflare deploy --name krypton-ecosystem
