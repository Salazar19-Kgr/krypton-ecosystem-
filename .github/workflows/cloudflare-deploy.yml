name: Deploy Krypton Ecosystem

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Krypton Ecosystem
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Install Vinext Cloudflare tooling
        run: |
          npm install \
            vite@8.3.2 \
            @vitejs/plugin-rsc \
            @cloudflare/vite-plugin \
            @vinext/cloudflare@1.0.1 \
            --legacy-peer-deps

      - name: Initialize Vinext
        run: npx vinext init

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Deploy Krypton Ecosystem
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx @vinext/cloudflare deploy
